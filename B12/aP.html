<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    body {
      height:  100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
    }

    h1 {
      font-size: 50px;
    }

    #element {
      color: orange;
    }
  </style>
</head>
<body>
  <h1>
    Tôi là <span id="element"></span>
  </h1>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
  <script>
    const typed = new Typed('#element', {
      strings: [
        'Frontend Developer',
        'Web Designer',
        'JavaScript Learner'
      ],
      typeSpeed: 70,
      backSpeed: 40,
      backDelay: 1000,
      loop: true
    });
  </script>

</body>
</html>
