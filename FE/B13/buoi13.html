<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* .my-btn{
            background-color: red;
            color: white;
        } */
    </style>
</head>
<body>
    <!-- <button class="btn btn-primary">Login</button> -->
    <!-- chiếm 100% màn hình -->
    <div class="container-fluid">Noi dung</div>
    <!-- sẵn padding, margin, canh giữ nội dung -->
    <div class="container">Noi dung</div>
    <!-- grid
     container -> row ->column -->
    <!-- chia san 12 cot , chia ra giua man hinh thi lay moi ben 6 cot -->
    <div class="row">
        <div class="col-4">Noi dung 1</div>
        <div class="col-4">Noi dung 2</div>
        <div class="col-4">Noi dung 3</div>
    </div>
    <!-- ultility class 
     1. margin
     - mt-5: margin top -> tao khoang trong tren
     - mb-5: margin bottom -> tao khoang trong duoi
     - ms-5: margin start -> tao khoang trong lon ben trai
     - me-5: margin end _-> tao khoang trong lon ben phai
     - mx-5: margin x -> tao khoang trong ben trai va phai
     - m-y5: margin y -> tao khoang trong ben tren va duoi
     - m-5: margin all-> tao khoang trong 4 phia
     2. padding 
     tuong tu margin
     -->
    <!--color backround/text color
    1. bg-primary: nen xanh duong
    2. bg-secondary: nen xam
    3. bg-success: nen xanh la
    4. bg-dark: nen den
    5. bg-light: nen trang
    ... -->
    <!--text aliment: can chinh vi tri van ban
    1. text-start: can trai
    2. text-end: can phai
    3. text-center: can giua
    4. fw-bold: in dam
    5. fw-light: in nhat
    6. fw-normal
    -->
    <!--display
    1. d-bliock
    2. d-inline
    3. d-inline-block
    4. d-none
    5. d-flex
    6. d-grid
    7. d-table
    -->
    <!--flex utility
    1. d-flex
    2. justify-content-center
    3. align-items-center
    4. flex-direction-column
    5. flex-direction-row-->
    <!--button
    1. btn: css chung
    2. btn-primary: button mau xanh duong
    ... tuong tu bg/text-->
    <!--breakpoint
    1. col-sm : 576px
    2. col-md: 768px
    3. col-lg: 992px
    4. col-xl: 1200px-->
    <div class="bg-dark text-light mt-5 text-center fw-bold">AAAAAA</div>
    <div class="d-flex justify-content-around align-items-center bg-primary text-light m-5 p-5">
        <h2>S-Group</h2>
        <h2>Hello</h2>
        <button class="btn btn-success">Login</button>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 bg-dark text-light p-3"> Box 1</div>
            <div class="col-12 col-sm-6 col-md-4 bg-success text-white p-3">Box 2</div>
            <div class="col-12 col-sm-6 col-md-4 bg-primary text-white p-3">Box 3</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
